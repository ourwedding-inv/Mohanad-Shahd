<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mohanad & Shahd Wedding Invitation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@400;500;600;700;800&family=Great+Vibes&family=Gulzar&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<body class="bg-landing">

  <!-- Language Switcher -->
  <button class="lang-toggle" onclick="changeLanguage('index_ar.html')" aria-label="Switch to Arabic">
    <div class="toggle-slider"></div>
    <span class="lang EN active">EN</span>
    <span class="lang AR">عربي</span>
  </button>

  <!-- Floating Icons Background -->
  <div class="floating-icons">
    <span>❀</span>
    <span>❤</span>
    <span>✈</span>
    <span>❤</span>
    <span>❀</span>
  </div>

  <!-- Landing Main Content Container -->
  <div class="landing-container">
    <div class="landing-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.7 5.2c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
      </svg>
    </div>

    <h1 class="landing-title">Mohanad & Shahd</h1>
    <p class="landing-sub">FLIGHT MS-2026 • OPEN INVITATION</p>

    <!-- Open Invitation Button -->
    <button class="open-btn" id="openBtn" data-target="main.html">
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <g fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dashed start of the flight path -->
    <path d="M 50,340 C 105,340 160,328 210,305" stroke-dasharray="20 16" />
    
    <!-- Continuous heart loop and flight path trailing to the airplane -->
    <path d="M 210,305 
             C 245,290 275,270 300,250 
             C 210,205 170,160 205,110 
             C 232,70 275,88 300,138 
             C 325,88 368,70 395,110 
             C 430,160 390,205 300,250 
             C 385,290 485,300 575,250 
             C 605,232 625,215 638,205" />
  </g>

  <!-- Airplane Silhouette (Scaled Larger & Color White) -->
  <g transform="translate(638, 205) rotate(-18) scale(1.35)" fill="#FFFFFF">
    <path d="M 120,-2 
             C 115,-8 95,-10 70,-10 
             L 55,-10 
             L 32,-48 
             L 22,-47 
             L 42,-10 
             L 15,-10 
             L -5,-45 
             L -20,-45 
             L -3,-8 
             L -12,-2 
             L -12,1 
             L -6,12 
             L -15,11 
             L -3,2 
             L 30,2 
             L 5,42 
             L -4,40 
             L 18,18 
             L 16,22 
             L 32,22 
             L 34,15 
             L 26,15 
             L 42,2 
             L 95,2 
             C 115,2 120,-2 120,-2 Z" />
  </g>
</svg>
      <span>Open Invitation</span>
    </button>
  </div>

  <!-- Redesigned Bigger Airplane + Tow Banner Facing Left -->
  <svg id="planeBanner" style="display:none" viewBox="0 0 920 220" xmlns="http://www.w3.org/2000/svg">
    <!-- AIRPLANE (FACING LEFT: Nose ~x=30, Tail ~x=235) -->
    <g class="plane-group">
      <!-- Tail Fin (Back Right of Plane) -->
      <path d="M220,95 L255,30 L230,30 L185,95 Z" fill="#C9A15A" stroke="#7A5C45" stroke-width="2.5" />
      <path d="M210,50 C210,44 204,40 198,45 C192,40 186,44 186,50 C186,58 198,65 198,65 C198,65 210,58 210,50 Z" fill="#FFF" opacity="0.95" />

      <!-- Main Fuselage Body -->
      <path d="M30,95 C100,50 200,40 240,95 C240,128 200,145 120,148 C60,150 30,128 30,95 Z" fill="#F2C14E" stroke="#8B6B52" stroke-width="4" />

      <!-- Swept Wings -->
      <path d="M120,95 L180,155 L150,155 L95,95 Z" fill="#D4AF37" stroke="#8B6B52" stroke-width="2.5" />

      <!-- Jet Engine / Wheel Bay -->
      <rect x="100" y="132" width="45" height="20" rx="10" fill="#2E2218" stroke="#D4AF37" stroke-width="2" />
      <ellipse cx="112" cy="142" rx="5" ry="9" fill="#A2E3ED" />

      <!-- Passenger Windows -->
      <g fill="#FFF" opacity="0.95">
        <circle cx="70" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="90" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="110" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="130" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="150" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="170" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
        <circle cx="190" stroke="#7A5C45" stroke-width="1" cy="85" r="4.5" />
      </g>

      <!-- Cockpit Window (Nose Left) -->
      <path d="M60,72 C42,72 32,82 32,95 L60,95 Z" fill="#A2E3ED" stroke="#3A2C1A" stroke-width="3" />

      <!-- Spinning Propeller Nose Blade -->
      <g class="propeller" transform="translate(25, 95)">
        <ellipse cx="0" cy="0" rx="3" ry="24" fill="#5E422C" opacity="0.85" />
        <circle cx="0" cy="0" r="5" fill="#D4AF37" />
      </g>
    </g>

    <!-- TOW LINES (Connecting Plane Tail to Banner) -->
    <line x1="240" y1="95" x2="310" y2="45" stroke="#F2C14E" stroke-width="3.5" stroke-dasharray="5 3"/>
    <line x1="240" y1="95" x2="310" y2="165" stroke="#F2C14E" stroke-width="3.5" stroke-dasharray="5 3"/>
    <line x1="240" y1="95" x2="310" y2="105" stroke="#FFF" stroke-width="2.5"/>

    <!-- ENLARGED BANNER (Trailing on the Right: x=310 to x=900) -->
    <g class="banner-group">
      <!-- Outer Banner Outline -->
      <path d="M310,35 L870,35 L910,68 L870,105 L910,142 L870,175 L310,175 Z" fill="#FFFDF9" stroke="#7A5C45" stroke-width="5"/>
      <!-- Inner Gold Trim Border -->
      <path d="M322,45 L858,45 L890,68 L858,105 L890,142 L858,165 L322,165 Z" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
      
      <!-- Banner Content Text -->
      <text x="590" y="92" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="28" fill="#5E422C" letter-spacing="2">LOVE IS IN THE AIR!</text>
      <text x="590" y="134" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="18" fill="#A67C52" letter-spacing="3">FLIGHT MS-2026 • MOHANAD & SHAHD</text>
    </g>
  </svg>

  <!-- Hidden Cloud Puff Template -->
  <svg id="cloudTemplate" style="display:none" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="35" rx="26" ry="18" fill="#fff" opacity="0.9"/>
    <ellipse cx="60" cy="24" rx="30" ry="22" fill="#fff" opacity="0.9"/>
    <ellipse cx="90" cy="36" rx="24" ry="16" fill="#fff" opacity="0.9"/>
  </svg>

  <script src="script.js"></script>
</body>
</html>
